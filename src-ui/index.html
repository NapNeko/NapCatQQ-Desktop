<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NapCatQQ Desktop</title>
  <!-- JS/CSS 到达前避免 WebView 闪屏；暗色系统用深底，与 tokens surface-canvas 对齐 -->
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      background: #faf7f2;
    }

    /* 只管跟随系统（没写 data-theme）的情况：选了具体主题时 syncRootChromeBackground
       会把主题画布色写成 html/body/#root 的内联背景，这里带 !important 会把它盖掉。 */
    @media (prefers-color-scheme: dark) {

      html:not([data-theme]),
      html:not([data-theme]) body,
      html:not([data-theme]) #root {
        background: #211f1d !important;
      }
    }
  </style>
</head>

<body>
  <div id="root" aria-busy="true" style="background-color: #faf7f2;"></div>
  <script type="module" src="/main.tsx"></script>
</body>

</html>
