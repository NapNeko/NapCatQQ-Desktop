<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>聊天 - NapCatQQ Desktop</title>
        <script>
            if (window.__TAURI_INTERNALS__ && /linux/i.test(navigator.userAgent)) {
                document.documentElement.dataset.nativeOs = 'linux';
            }
        </script>
        <style>
            html,
            body,
            #root {
                height: 100%;
                margin: 0;
                background: #faf7f2;
            }
            @media (prefers-color-scheme: dark) {
                html:not([data-theme]),
                html:not([data-theme]) body,
                html:not([data-theme]) #root {
                    background: #211f1d !important;
                }
            }
            html[data-native-os='linux'] {
                --ncd-window-radius: 12px;
                overflow: hidden;
                clip-path: inset(0 round var(--ncd-window-radius));
                background: transparent !important;
            }
            html[data-native-os='linux'][data-window-expanded] {
                --ncd-window-radius: 0px;
            }
            html[data-native-os='linux'] body {
                background: transparent !important;
            }
        </style>
    </head>
    <body>
        <div id="root" aria-busy="true" style="background-color: #faf7f2"></div>
        <script type="module" src="/chat-main.ts"></script>
    </body>
</html>
