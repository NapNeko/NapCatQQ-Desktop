[workspace]
members = [
    "src-tauri",
    "crates/ncd-domain",
    "crates/ncd-traits",
    "crates/ncd-host",
    "crates/ncd-network",
    "crates/ncd-component",
    "crates/ncd-deploy",
    "crates/ncd-update",
    "crates/ncd-runtime",
    "crates/ncd-log",
    "crates/ncd-test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"
incremental = false
debug = false
