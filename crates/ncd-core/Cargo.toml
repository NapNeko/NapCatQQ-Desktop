[package]
name = "ncd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
keyring = "2"
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
tokio = { version = "1", features = ["fs", "process", "sync", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "10", features = ["serde-compat"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
# SnowLuma backend runtime 依赖（spec: snowluma-backend-runtime, task 1.1）
# - sysinfo: Windows 子进程树枚举 (proc_tree.rs / commands/snowluma.rs)
# - scrypt:  webui.json 密码哈希；纯 Rust 实现，免 OpenSSL (session.rs)
# - rand:    强随机密码生成（已在上方声明，复用）
sysinfo = "0.31"
scrypt = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# `test-util` feature enables `tokio::test(start_paused = true)` and
# `tokio::time::pause()`，专供 `napcat_login_poller` 状态机端到端单测使用。
tokio = { version = "1", features = ["test-util"] }
# `proptest` 用于 `napcat_login_poller` 的属性测试 (Property 1/2/3/4/6/7)。
proptest = "1"
