[package]
name = "ncd-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ncd-domain = { path = "../ncd-domain" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1"
bytes = "1"

# 归档解压(M3.2)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# M3.3 阶段会启用:
# russh = "0.45"           # SSH 通道
# russh-sftp = "0.5"       # SFTP
#
# M5 阶段会启用(winget/choco PackageManager):
# winreg = "0.52"
# which = "6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
