[package]
name = "ncd-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ncd-domain = { path = "../ncd-domain" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "fs", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat"] }
bytes = "1"

# 归档解压(M3.2)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# SSH / SFTP 远端通道(M3.3)
russh = "0.45"
russh-sftp = "2"

# M5 阶段会启用(winget/choco PackageManager):
# winreg = "0.52"
# which = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # SHELLEXECUTEINFOW 引用 HKEY,ShellExecuteExW 挂在 Registry feature 下
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
