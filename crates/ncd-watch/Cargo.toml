[package]
name = "ncd-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote host-side process/container watcher and offline webhook (Desktop-independent)"

[[bin]]
name = "ncd-watch"
path = "src/main.rs"

[lib]
name = "ncd_watch"
path = "src/lib.rs"

[dependencies]
ncd-domain = { path = "../ncd-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }

[lints]
workspace = true
