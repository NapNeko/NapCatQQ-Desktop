[package]
name = "ncd-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote host-side process/container watcher and offline webhook (Desktop-independent)"

# Desktop / ncd-runtime 只依赖 schema(default-features=false),不把探活/Webhook/CLI 链进 MSI。
# 远端二进制与 CI 用默认 feature「daemon」打完整包。
[features]
default = ["daemon"]
daemon = [
    "dep:ncd-relogin",
    "dep:ncd-onebot",
    "dep:async-trait",
    "dep:uuid",
    "dep:base64",
    "dep:qrcode",
    "dep:image",
    "dep:reqwest",
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:hex",
    "dep:lettre",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/time",
    "tokio/fs",
    "tokio/signal",
    "tokio/process",
    "tokio/io-util",
    "tokio/sync",
]

[[bin]]
name = "ncd-watch"
path = "src/main.rs"
required-features = ["daemon"]

[lib]
name = "ncd_watch"
path = "src/lib.rs"

[dependencies]
ncd-domain = { path = "../ncd-domain" }
ncd-relogin = { path = "../ncd-relogin", optional = true }
ncd-onebot = { path = "../ncd-onebot", optional = true }
async-trait = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
base64 = { version = "0.22", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["image"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", default-features = false, optional = true }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
sha2 = "0.10"
hex = { version = "0.4", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
