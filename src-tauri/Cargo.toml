[package]
name = "ncd-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
ncd-runtime = { path = "../crates/ncd-runtime" }
ncd-traits = { path = "../crates/ncd-traits" }
ncd-log = { path = "../crates/ncd-log" }
ncd-component = { path = "../crates/ncd-component" }
ncd-deploy = { path = "../crates/ncd-deploy" }
ncd-host = { path = "../crates/ncd-host" }
ncd-domain = { path = "../crates/ncd-domain" }
ncd-network = { path = "../crates/ncd-network" }
ncd-mcp = { path = "../crates/ncd-mcp" }
ncd-update = { path = "../crates/ncd-update" }
dirs = "5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["fs", "process", "sync", "io-util", "rt", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.31"
ts-rs = { version = "12", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
base64 = "0.22"
urlencoding = "2"
url = "2"
netstat2 = "0.9"
async-trait = "0.1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # 终端右键粘贴读剪贴板
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # WebView 调度按进程取私有内存 / 工作集
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-winrt-notification = "0.7"
# WebView 调度直接调 WebView2（进程归属、可见性、内存级别）；跟 wry 用的版本走，别单独升
webview2-com = "0.38"
winreg = "0.52"


[build-dependencies]
tauri-build = { version = "2", features = [] }
[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
ncd-test-support = { path = "../crates/ncd-test-support" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "NapCatQQ-Desktop"
path = "src/main.rs"

[lints]
workspace = true
