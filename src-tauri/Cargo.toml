[package]
name = "ncd-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
ncd-runtime = { path = "../crates/ncd-runtime" }
ncd-traits = { path = "../crates/ncd-traits" }
ncd-log = { path = "../crates/ncd-log" }
ncd-component = { path = "../crates/ncd-component" }
ncd-deploy = { path = "../crates/ncd-deploy" }
ncd-host = { path = "../crates/ncd-host" }
ncd-domain = { path = "../crates/ncd-domain" }
dirs = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["fs", "process", "sync", "io-util", "rt", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.31"
ts-rs = { version = "12", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
base64 = "0.22"
urlencoding = "2"
url = "2"
netstat2 = "0.9"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell"] }
tauri-winrt-notification = "0.7"
winreg = "0.52"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
ncd-test-support = { path = "../crates/ncd-test-support" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "NapCatQQ-Desktop"
path = "src/main.rs"

[lints]
workspace = true
