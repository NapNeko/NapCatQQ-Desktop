[package]
name = "ncd-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
ncd-runtime = { path = "../crates/ncd-runtime" }
dirs = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "process", "sync", "io-util", "rt", "macros", "time"] }
tauri-plugin-opener = "2.5.4"
sysinfo = "0.31"
ts-rs = { version = "10", features = ["serde-compat"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ncd-tauri"
path = "src/main.rs"
