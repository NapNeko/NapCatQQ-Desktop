# Linux x64 安装包；与 MSI 一起由 release.yml 发布。
name: Build Linux Packages

on:
  workflow_call:
    inputs:
      git_ref:
        description: "构建所基于的 Git ref"
        required: false
        default: ""
        type: string
    outputs:
      artifact_name:
        description: "上传的 Linux 制品名"
        value: ${{ jobs.build.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      git_ref:
        description: "构建所基于的 Git ref；为空时使用当前触发 ref"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-linux-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    # 使用较旧的 glibc 构建，兼容 Ubuntu 22.04 及更新发行版。
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 不缓存 target：workspace 产物可能含有编译期代理密钥。
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-package-dependencies
          cache-targets: "false"
          cache-bin: "false"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version metadata
        run: pnpm run check:versions

      - name: Build Linux packages
        env:
          # AppImage 工具通过解包运行，托管 runner 无需挂载 FUSE。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NCD_PROXY_BASE_URL: ${{ vars.NCD_PROXY_BASE_URL || 'https://napcat-desktop.aqiaoyo.top' }}
          NCD_PROXY_SECRET: ${{ secrets.NCD_PROXY_SECRET }}
          NCD_PROXY_SHARED_SECRET: ${{ secrets.NCD_PROXY_SHARED_SECRET }}
        run: pnpm run tauri:build:linux

      - name: Collect Linux packages
        id: collect
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp target/release/bundle/deb/*.deb "release-assets/NapCatQQ-Desktop-${version}-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "release-assets/NapCatQQ-Desktop-${version}-x86_64.AppImage"
          echo "artifact_name=linux-x64-${version}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*
