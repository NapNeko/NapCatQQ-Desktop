# Linux x64 安装包；与 MSI 一起由 release.yml 发布。
name: Build Linux Packages

on:
  workflow_call:
    inputs:
      warm_cache:
        description: "只在 main 预热依赖缓存，不打包或上传制品"
        required: false
        default: false
        type: boolean
      git_ref:
        description: "构建所基于的 Git ref"
        required: false
        default: ""
        type: string
    outputs:
      artifact_name:
        description: "上传的 Linux 制品名"
        value: ${{ jobs.build.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      git_ref:
        description: "构建所基于的 Git ref；为空时使用当前触发 ref"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-linux-${{ inputs.warm_cache && 'cache' || 'package' }}-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    # 使用较旧的 glibc 构建，兼容 Ubuntu 22.04 及更新发行版。
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 与 Windows 相同，只复用经过清理的第三方编译产物。
      - name: Cache Cargo dependencies
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-linux-deps-v1
          # rust-cache 未计入虚拟 workspace 根清单，需显式跟踪 release profile。
          shared-key: linux-package-dependencies-${{ hashFiles('Cargo.toml') }}
          cache-workspace-crates: "false"
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ inputs.warm_cache && github.ref == 'refs/heads/main' }}

      - name: Verify dependency-only cache
        run: node scripts/ci-release-cache.mjs check

      - name: Install frontend dependencies
        if: ${{ !inputs.warm_cache || steps.cache.outputs.cache-hit != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check version metadata
        run: pnpm run check:versions

      - name: Build Linux packages
        if: ${{ !inputs.warm_cache || steps.cache.outputs.cache-hit != 'true' }}
        env:
          # AppImage 工具通过解包运行，托管 runner 无需挂载 FUSE。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NCD_PROXY_BASE_URL: ${{ vars.NCD_PROXY_BASE_URL || 'https://napcat-desktop.aqiaoyo.top' }}
          NCD_PROXY_SECRET: ${{ secrets.NCD_PROXY_SECRET }}
          NCD_PROXY_SHARED_SECRET: ${{ secrets.NCD_PROXY_SHARED_SECRET }}
        run: pnpm run tauri:build ${{ inputs.warm_cache && '--no-bundle' || '--bundles deb,appimage' }} -- --locked

      - name: Verify AppImage desktop integration
        if: ${{ !inputs.warm_cache }}
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(realpath target/release/bundle/appimage/*.AppImage)
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          "$appimage" --appimage-extract > /dev/null
          desktop=(squashfs-root/*.desktop)
          [[ ${#desktop[@]} -eq 1 ]]
          for entry in "${desktop[0]}" squashfs-root/.DirIcon; do
            [[ -f "$entry" ]]
            if [[ -L "$entry" ]]; then
              [[ $(readlink "$entry") != /* ]]
            fi
          done
          ! grep -Eq '^NoDisplay=true[[:space:]]*$' "${desktop[0]}"

      - name: Collect Linux packages
        if: ${{ !inputs.warm_cache }}
        id: collect
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp target/release/bundle/deb/*.deb "release-assets/NapCatQQ-Desktop-${version}-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "release-assets/NapCatQQ-Desktop-${version}-x86_64.AppImage"
          echo "artifact_name=linux-x64-${version}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        if: ${{ !inputs.warm_cache }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: release-assets/*

      - name: Remove workspace artifacts before caching
        run: node scripts/ci-release-cache.mjs clean
