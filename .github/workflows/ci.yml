# 质量门禁：PR 按改动路径过滤（rust / frontend 互不相关则跳过）；
# 手动 dispatch 可选手动 suite 加速迭代（忽略路径过滤）。
# MSI 打包见 build-msi.yml / release.yml。
# Rust 全量测试必须在 Windows（大量 #[cfg(windows)]）。
#
# 关于「虚拟机复用」：
#   GitHub-hosted runner 每次 job 都是新 VM，不能整机复用。
#   能复用的是 Cargo/pnpm 缓存（Swatinem/rust-cache、setup-node cache）。
#   要真·常驻机只能 self-hosted runner。
#
# Job 拓扑：changes → frontend / rust-core / rust-shell（并行）→ gate。
#   rust-core  --exclude ncd-tauri：ncd-* 纯 Rust  crate，
#   rust-shell 只编 ncd-tauri：tauri/wry/tao/webview2 链是大头，拆开并行才省墙钟。
#
# 分支策略：
#   main  ← Rust/Tauri 主线
#   v1    ← 旧 Python 归档，不跑本 CI

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "跑哪些门禁（PR 固定 full）"
        required: false
        default: full
        type: choice
        options:
          - full
          - frontend
          - rust
          - rust-smoke

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.suite || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 跨 job 靠 rust-cache 复用 target；job 内增量对 Windows 收益有限且易脏缓存
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本检查在 frontend，版本文件必须进 frontend 过滤；
      # tauri.conf.json 同时在两端过滤内。
      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src-ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'frontend'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Check version metadata
        run: pnpm run check:versions

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      # OneBot 探针是注入用户 Bot 进程的脚本，只能靠线级回归守住
      - name: Probe tests
        run: pnpm run test:probe

  rust-core:
    name: Rust core (Windows)
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'rust' || github.event.inputs.suite == 'rust-smoke'))
    runs-on: windows-latest
    env:
      # 全量符号的 PDB 在 Windows 大量测试二进制的链接上非常贵；line-table 足够定位
      RUSTFLAGS: -C debuginfo=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本 job 不跑 clippy/fmt，不装组件可少下几百 MB
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 托管 Windows runner 是管理员；Defender 实时扫 target/registry 是编译大头之一
      - name: Exclude build dirs from Defender scan
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath $env:RUSTUP_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # bump key 时会冷启动一次；之后跨 run 复用 registry/git/target
          # v3: 排除 ncd-tauri 后的依赖图，与 rust-shell 分开缓存
          shared-key: ci-windows-core-v3
          workspaces: ". -> target"
          cache-all-crates: true

      # ts-bindings 写出 src-ui/core/ipc/generated；需与提交一致（R1）。
      # ncd-tauri 里没有 export_bindings_ 用例，排除可避免编译 tauri 链。
      - name: Export ts-rs bindings
        shell: pwsh
        run: cargo test --workspace --exclude ncd-tauri --lib export_bindings_ -- --quiet

      - name: Assert generated IPC types committed
        shell: pwsh
        run: git diff --exit-code -- src-ui/core/ipc/generated

      # 快速回归：只跑近期易碎的 integration / compose，不跑全 workspace
      - name: Smoke tests
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'rust-smoke'
        shell: pwsh
        run: |
          cargo test -p ncd-runtime --test bot_manager -- --quiet
          cargo test -p ncd-deploy --lib docker::compose::tests -- --quiet
          cargo test -p ncd-backend-napcat --lib napcat::login_poller -- --quiet

      # 全量：复用上一步已编译的 target
      - name: Workspace tests
        if: >-
          github.event_name == 'pull_request' ||
          github.event.inputs.suite == 'full' ||
          github.event.inputs.suite == 'rust'
        run: cargo test --workspace --exclude ncd-tauri

  # tauri/wry/tao/webview2 链编译极慢；独立 job 与 rust-core 并行，
  # 顺手跑 src-tauri 自带的 21 个 #[cfg(test)] 单测，覆盖面不回退。
  rust-shell:
    name: Rust shell / Tauri (Windows)
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'rust'))
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C debuginfo=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Exclude build dirs from Defender scan
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath $env:RUSTUP_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-shell-v3
          workspaces: ". -> target"
          cache-all-crates: true

      - name: Shell tests (ncd-tauri)
        run: cargo test -p ncd-tauri

  gate:
    name: Gate
    needs:
      - changes
      - frontend
      - rust-core
      - rust-shell
    runs-on: ubuntu-latest
    if: always()
    steps:
      # should=1：必须 success；should=0：允许 legitimately skipped。
      # failure / cancelled / 应跑却 skipped 一律算挂。
      - name: Require green jobs
        shell: bash
        run: |
          set -euo pipefail
          fe="${{ needs.frontend.result }}"
          rc="${{ needs['rust-core'].result }}"
          rs="${{ needs['rust-shell'].result }}"
          ch="${{ needs.changes.result }}"
          flt_fe="${{ needs.changes.outputs.frontend }}"
          flt_rs="${{ needs.changes.outputs.rust }}"
          echo "changes=$ch frontend=$fe (filter=$flt_fe) rust-core=$rc rust-shell=$rs (filter=$flt_rs)"

          fail=0
          check() {
            local name="$1" res="$2" should="$3"
            if [[ "$should" == "1" && "$res" != "success" ]]; then
              echo "CI gate failed: $name=$res (expected success)" >&2
              fail=1
            elif [[ "$should" == "0" && "$res" != "skipped" && "$res" != "success" ]]; then
              echo "CI gate failed: unexpected $name=$res" >&2
              fail=1
            fi
          }

          check changes "$ch" 1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "$flt_fe" == "true" ]] && check frontend "$fe" 1 || check frontend "$fe" 0
            if [[ "$flt_rs" == "true" ]]; then
              check rust-core "$rc" 1
              check rust-shell "$rs" 1
            else
              check rust-core "$rc" 0
              check rust-shell "$rs" 0
            fi
          else
            suite="${{ github.event.inputs.suite || 'full' }}"
            need_fe=0; need_rc=0; need_rs=0
            case "$suite" in
              full) need_fe=1; need_rc=1; need_rs=1 ;;
              frontend) need_fe=1 ;;
              rust) need_rc=1; need_rs=1 ;;
              rust-smoke) need_rc=1 ;;
              *) echo "unknown suite: $suite" >&2; exit 1 ;;
            esac
            check frontend "$fe" "$need_fe"
            check rust-core "$rc" "$need_rc"
            check rust-shell "$rs" "$need_rs"
          fi
          exit $fail
