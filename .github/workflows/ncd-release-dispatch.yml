name: Dispatch Desktop v3.5.4 release
on:
  push:
    branches: [codex/release-3.5.4-20261022]
    paths: [.github/workflows/ncd-release-dispatch.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const expected = '542b36ebc54a231cda8096393e4bb78aacd40e73';
            const version = '3.5.4';
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== expected) {
              throw new Error('main moved after validation; refusing to publish another commit');
            }
            for (const path of ['package.json', 'src-tauri/tauri.conf.json']) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: expected });
              const value = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
              if (value.version !== version) throw new Error(path + ' version mismatch');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: 'main',
              event: 'push', head_sha: expected, per_page: 20,
            });
            if (!runs.data.workflow_runs.some(run =>
              run.head_sha === expected && run.status === 'completed' && run.conclusion === 'success')) {
              throw new Error('The exact main commit has no successful CI run');
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/v' + version });
              throw new Error('Release tag already exists');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'release.yml', ref: 'main',
              inputs: { version, draft: 'false', run_gates: 'false', dry_run: 'false' },
            });
            console.log('DISPATCHED_RELEASE v' + version + ' main=' + expected);
