name: Build MSI Package

on:
  workflow_call:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      git_ref:
        description: "构建所基于的 Git ref"
        required: false
        default: ""
        type: string
      upload_artifact_name:
        description: "MSI 制品名；为空时自动按版本生成"
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "带 v 前缀的版本号"
        value: ${{ jobs.build.outputs.version }}
      version_plain:
        description: "不带 v 前缀的版本号"
        value: ${{ jobs.build.outputs.version_plain }}
      artifact_name:
        description: "上传的 MSI 制品名"
        value: ${{ jobs.build.outputs.artifact_name }}
      msi_file_name:
        description: "MSI 文件名"
        value: ${{ jobs.build.outputs.msi_file_name }}
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      git_ref:
        description: "构建所基于的 Git ref；为空时使用当前触发 ref"
        required: false
        default: ""
        type: string
      upload_artifact_name:
        description: "MSI 制品名；为空时自动按版本生成"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve_version.outputs.VERSION }}
      version_plain: ${{ steps.resolve_version.outputs.VERSION_PLAIN }}
      artifact_name: ${{ steps.resolve_artifact.outputs.ARTIFACT_NAME }}
      msi_file_name: ${{ steps.collect_msi.outputs.MSI_FILE_NAME }}
    steps:
      - name: "检出代码"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          submodules: true
          fetch-depth: 0

      - name: "设置 Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: "设置 Rust"
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: "缓存 Cargo"
        uses: Swatinem/rust-cache@v2

      - name: "安装前端依赖"
        run: npm ci

      - name: "解析版本号"
        id: resolve_version
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"

          if ($inputVersion) {
            $version = $inputVersion
          } elseif (Test-Path "src-tauri/tauri.conf.json") {
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $version = $config.version
          } elseif (Test-Path "package.json") {
            $package = Get-Content "package.json" -Raw | ConvertFrom-Json
            $version = $package.version
          } else {
            Write-Error "无法从输入、src-tauri/tauri.conf.json 或 package.json 解析版本号"
            exit 1
          }

          if (-not $version) {
            Write-Error "解析出的版本号为空"
            exit 1
          }

          if (-not ($version -like "v*")) {
            $version = "v$version"
          }

          $plain = $version -replace "^v", ""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION_PLAIN=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $version"

      - name: "校验版本元数据"
        run: npm run check:versions

      - name: "运行综合门禁"
        run: npm run verify

      - name: "检查生成的 IPC 类型已提交"
        shell: pwsh
        run: |
          git diff --exit-code -- src-ui/core/ipc/generated

      - name: "运行 Rust 测试"
        run: npm run rust:test

      - name: "运行前端单元测试"
        run: npm run test:unit

      - name: "构建 Tauri MSI"
        run: npm run tauri:build -- --bundles msi

      - name: "收集 MSI 输出"
        id: collect_msi
        shell: pwsh
        run: |
          $bundleRoot = "target/release/bundle"
          $msiFiles = Get-ChildItem -Path $bundleRoot -Filter "*.msi" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            Write-Error "未在 $bundleRoot 下找到 MSI 输出"
            exit 1
          }

          $outDir = "release-assets"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName -Destination $outDir -Force
          }

          $updaterAssets = Get-ChildItem -Path $bundleRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "latest.json" -or $_.Extension -eq ".sig" -or $_.Extension -eq ".zip" }
          foreach ($file in $updaterAssets) {
            Copy-Item $file.FullName -Destination $outDir -Force
          }

          $primary = $msiFiles | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          "MSI_FILE_NAME=$($primary.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Collected MSI: $($primary.FullName)"

      - name: "解析制品名"
        id: resolve_artifact
        shell: pwsh
        run: |
          $artifactName = "${{ inputs.upload_artifact_name }}"
          if (-not $artifactName) {
            $artifactName = "windows-msi-${{ steps.resolve_version.outputs.VERSION_PLAIN }}"
          }
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: "上传 MSI 制品"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_artifact.outputs.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*
