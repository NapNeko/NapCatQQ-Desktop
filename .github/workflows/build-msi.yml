# 只负责 Windows MSI 打包与布局断言。质量门禁在 ci.yml；发版编排在 release.yml。

name: Build MSI Package

on:
  workflow_call:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      git_ref:
        description: "构建所基于的 Git ref"
        required: false
        default: ""
        type: string
      upload_artifact_name:
        description: "MSI 制品名；为空时自动按版本生成"
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "带 v 前缀的版本号"
        value: ${{ jobs.build.outputs.version }}
      version_plain:
        description: "不带 v 前缀的版本号"
        value: ${{ jobs.build.outputs.version_plain }}
      artifact_name:
        description: "上传的 MSI 制品名"
        value: ${{ jobs.build.outputs.artifact_name }}
      msi_file_name:
        description: "MSI 文件名"
        value: ${{ jobs.build.outputs.msi_file_name }}
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      git_ref:
        description: "构建所基于的 Git ref；为空时使用当前触发 ref"
        required: false
        default: ""
        type: string
      upload_artifact_name:
        description: "MSI 制品名；为空时自动按版本生成"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-msi-${{ inputs.git_ref || github.ref }}-${{ inputs.version || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve_version.outputs.VERSION }}
      version_plain: ${{ steps.resolve_version.outputs.VERSION_PLAIN }}
      artifact_name: ${{ steps.resolve_artifact.outputs.ARTIFACT_NAME }}
      msi_file_name: ${{ steps.collect_msi.outputs.MSI_FILE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-msi-windows
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: resolve_version
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"

          if ($inputVersion) {
            $version = $inputVersion
          } elseif (Test-Path "src-tauri/tauri.conf.json") {
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $version = $config.version
          } elseif (Test-Path "package.json") {
            $package = Get-Content "package.json" -Raw | ConvertFrom-Json
            $version = $package.version
          } else {
            Write-Error "无法从输入、src-tauri/tauri.conf.json 或 package.json 解析版本号"
            exit 1
          }

          if (-not $version) {
            Write-Error "解析出的版本号为空"
            exit 1
          }

          if (-not ($version -like "v*")) {
            $version = "v$version"
          }

          $plain = $version -replace "^v", ""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION_PLAIN=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $version"

      - name: Check version metadata
        run: pnpm run check:versions

      - name: Build Tauri MSI
        run: pnpm run tauri:build -- --bundles msi

      - name: Collect MSI output
        id: collect_msi
        shell: pwsh
        run: |
          $bundleRoot = "target/release/bundle"
          $msiFiles = Get-ChildItem -Path $bundleRoot -Filter "*.msi" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            Write-Error "未在 $bundleRoot 下找到 MSI 输出"
            exit 1
          }

          $outDir = "release-assets"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $primary = $msiFiles | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $expectedName = "NapCatQQ-Desktop-${{ steps.resolve_version.outputs.VERSION_PLAIN }}-x64.msi"
          $expectedPath = Join-Path $outDir $expectedName
          Copy-Item $primary.FullName -Destination $expectedPath -Force

          $latestAlias = Join-Path $outDir "NapCatQQ-Desktop-x64.msi"
          Copy-Item $primary.FullName -Destination $latestAlias -Force

          # updater 未接线时通常没有这些文件；有则一并收集，发布侧再条件上传。
          $updaterAssets = Get-ChildItem -Path $bundleRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "latest.json" -or $_.Extension -eq ".sig" -or $_.Extension -eq ".zip" }
          foreach ($file in $updaterAssets) {
            Copy-Item $file.FullName -Destination $outDir -Force
          }

          "MSI_FILE_NAME=$expectedName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Collected MSI: $expectedPath"
          Get-ChildItem $outDir | ForEach-Object { Write-Host ("  asset: {0} ({1} bytes)" -f $_.Name, $_.Length) }

      - name: Assert MSI UpgradeCode and layout
        shell: pwsh
        run: |
          $msi = Join-Path "release-assets" "${{ steps.collect_msi.outputs.MSI_FILE_NAME }}"
          if (-not (Test-Path $msi)) {
            Write-Error "MSI not found for assert: $msi"
            exit 1
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/assert-msi-layout.ps1" -MsiPath $msi

      - name: Resolve artifact name
        id: resolve_artifact
        shell: pwsh
        run: |
          $artifactName = "${{ inputs.upload_artifact_name }}"
          if (-not $artifactName) {
            $artifactName = "windows-msi-${{ steps.resolve_version.outputs.VERSION_PLAIN }}"
          }
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_artifact.outputs.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*
