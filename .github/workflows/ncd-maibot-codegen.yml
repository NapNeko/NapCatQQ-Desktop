name: Temporary MaiBot schema refresh
on:
  push:
    branches: [codex/framework-config-20261022]
    paths:
      - .github/workflows/ncd-maibot-codegen.yml
      - scripts/maibot/codegen.py
permissions:
  contents: read
concurrency:
  group: ncd-maibot-codegen
  cancel-in-progress: true
jobs:
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Mai-with-u/MaiBot
          ref: c602a2780f4f4dda4a6be46d67abc1cfb1ad420c
          path: .ncd-codegen-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: python -m pip install pydantic==2.11.7 tomlkit==0.13.3
      - name: Generate from audited configuration declarations
        run: |
          python -m py_compile scripts/maibot/codegen.py
          python scripts/maibot/codegen.py --src .ncd-codegen-upstream --revision c602a2780f4f4dda4a6be46d67abc1cfb1ad420c
      - name: Build standalone schema binding exporter
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("crates/ncd-maibot-codegen")
          (root / "src").mkdir(parents=True)
          (root / "Cargo.toml").write_text('''[package]
          name = "ncd-maibot-codegen"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          toml = "0.8"
          ts-rs = { version = "12", features = ["serde-compat"] }
          fancy-regex = "0.14"
          ''')
          (root / "src/lib.rs").write_text('''#![allow(dead_code)]
          pub struct IssueSink;
          impl IssueSink {
              pub fn range(&mut self, _: &str, _: f64, _: Option<f64>, _: Option<f64>) {}
              pub fn one_of(&mut self, _: &str, _: &str, _: &[&str]) {}
              pub fn push(&mut self, _: impl Into<String>, _: impl Into<String>) {}
          }
          #[path = "../../ncd-appframework/src/maibot/schema/generated.rs"]
          pub mod generated;
          ''')
          (root / "src/main.rs").write_text('''use ncd_maibot_codegen::generated::{MaiBotBotConfigFile, MaiBotModelConfigFile};
          fn main() {
              let base = std::path::Path::new(env!("CARGO_MANIFEST_DIR")).parent().unwrap().parent().unwrap();
              let text = std::fs::read_to_string(base.join("crates/ncd-appframework/src/maibot/schema/defaults/model_config.toml")).unwrap();
              let mut table: toml::Table = toml::from_str(&text).unwrap();
              table.remove("inner");
              for model in table.get_mut("models").and_then(toml::Value::as_array_mut).into_iter().flatten() {
                  if let Some(extra) = model.get_mut("extra_params") {
                      if let toml::Value::Table(value) = extra {
                          *extra = toml::Value::String(toml::Value::Table(value.clone()).to_string());
                      }
                  }
              }
              let models: MaiBotModelConfigFile = toml::Value::Table(table).try_into().unwrap();
              let defaults = serde_json::json!({ "bot": MaiBotBotConfigFile::default(), "models": models });
              std::fs::write(base.join("src-ui/core/domain/apps/maibotDefaults.json"), serde_json::to_string_pretty(&defaults).unwrap() + "\n").unwrap();
          }
          ''')
          PY
          cargo test --manifest-path crates/ncd-maibot-codegen/Cargo.toml --quiet -- --test-threads=2
          cargo run --manifest-path crates/ncd-maibot-codegen/Cargo.toml --quiet
      - name: Emit changed files with checksums
        if: always()
        run: |
          python - <<'PY'
          import base64, hashlib, json, shutil, subprocess
          from pathlib import Path
          root = Path(".")
          output = Path("/tmp/ncd-maibot-codegen")
          output.mkdir()
          prefixes = (
              "crates/ncd-appframework/src/maibot/schema/",
              "src-ui/core/domain/apps/maibotSchema/",
              "src-ui/core/ipc/generated/maibot/",
          )
          changed = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          changed += subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"]).decode().splitlines()
          paths = sorted(set(p for p in changed if p.startswith(prefixes) or p == "src-ui/core/domain/apps/maibotDefaults.json"))
          manifest = []
          patches = []
          for name in paths:
              path = root / name
              if not path.is_file():
                  continue
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              destination = output / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              manifest.append({"path": name, "sha256": digest, "size": len(data)})
              encoded = base64.b64encode(data).decode("ascii")
              chunks = [encoded[i:i+6000] for i in range(0, len(encoded), 6000)] or [""]
              for i, chunk in enumerate(chunks):
                  print("NCD_CODEGEN " + json.dumps({"path": name, "sha256": digest, "parts": len(chunks), "index": i, "data": chunk}), flush=True)
              tracked = subprocess.run(["git", "ls-files", "--error-unmatch", name], capture_output=True).returncode == 0
              args = ["git", "diff", "--binary", "--", name] if tracked else ["git", "diff", "--no-index", "--binary", "/dev/null", name]
              patches.append(subprocess.run(args, capture_output=True).stdout)
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (output / "changes.patch").write_bytes(b"\n".join(patches))
          print("NCD_CODEGEN_MANIFEST " + json.dumps(manifest), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncd-maibot-codegen
          path: /tmp/ncd-maibot-codegen
