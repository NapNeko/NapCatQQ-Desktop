# Desktop Windows / Linux 发版。与 ncd-watch 的 watch-v* 分流；本工作流只响应 v*.*.*。
# 质量门禁默认信任 ci.yml；run_gates 复用同一套并行测试和缓存，与打包并行。

name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tag / tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      draft:
        description: "是否创建 draft release"
        required: false
        default: true
        type: boolean
      run_gates:
        description: "发版前再跑一遍门禁（Windows cargo test + 前端）；默认关闭以缩短发版"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "只验证门禁与 Windows / Linux 打包，不创建或更新 GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_plain: ${{ steps.version.outputs.VERSION_PLAIN }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.version }}"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            raw="${{ github.ref_name }}"
          elif [[ -n "${input_version}" ]]; then
            raw="${input_version}"
          elif [[ -f src-tauri/tauri.conf.json ]]; then
            raw="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          elif [[ -f package.json ]]; then
            raw="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          else
            echo "无法从 tag、输入、tauri.conf.json 或 package.json 解析版本号" >&2
            exit 1
          fi

          plain="${raw#v}"
          if [[ -z "${plain}" ]]; then
            echo "解析出的版本号为空: raw=${raw}" >&2
            exit 1
          fi

          version="v${plain}"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION_PLAIN=${plain}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved Desktop version: ${version}"

  gates:
    name: Optional release gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gates }}
    uses: ./.github/workflows/ci.yml
    with:
      force_full: true
    # 测试不需要发布凭据；复用主线测试缓存，不传入构建 secrets。
    permissions:
      contents: read
      pull-requests: read

  build-msi:
    needs: resolve
    # 打包与测试并行；publish 统一等待两者通过。
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      git_ref: ${{ github.sha }}
    secrets: inherit

  build-linux:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      git_ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs:
      - resolve
      - gates
      - build-msi
      - build-linux
    # 可选门禁跳过时仍可发布；失败、取消或整次取消都不能发布。
    if: ${{ !cancelled() && !inputs.dry_run && needs.resolve.result == 'success' && needs.build-msi.result == 'success' && needs.build-linux.result == 'success' && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-msi.outputs.artifact_name }}
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: release-assets

      - name: Verify assets and checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          msis=(*.msi)
          if [[ ${#msis[@]} -lt 1 ]]; then
            echo "release-assets 中没有 MSI" >&2
            ls -la
            exit 1
          fi
          debs=(*.deb)
          appimages=(*.AppImage)
          if [[ ${#debs[@]} -lt 1 || ${#appimages[@]} -lt 1 ]]; then
            echo "release-assets 中缺少 Linux 安装包" >&2
            exit 1
          fi
          : > SHA256SUMS
          for f in *; do
            [[ -f "$f" ]] || continue
            [[ "$f" == "SHA256SUMS" ]] && continue
            sha256sum "$f" >> SHA256SUMS
          done
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
          ls -lh

      - name: Render release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          plain="${{ needs.resolve.outputs.version_plain }}"
          notes_path=release-notes.md
          # 优先 docs/releases/vX.Y.Z.md；无策展文件时脚本生成过滤后的自动草稿
          node scripts/release-notes.mjs render \
            --kind desktop \
            --version "${plain}" \
            --out "${notes_path}"
          echo "NOTES_PATH=${notes_path}" >> "$GITHUB_OUTPUT"
          echo "---- release notes ----"
          cat "${notes_path}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NapCatQQ Desktop ${{ needs.resolve.outputs.version_plain }}
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          # 仓库首页的 Latest 只给 Desktop;release-ncd-watch.yml 那边是 false
          make_latest: "true"
          # 自更新走 GitHub Release MSI，不上传 latest.json / .sig
          files: |
            release-assets/*.msi
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/SHA256SUMS
          fail_on_unmatched_files: false
