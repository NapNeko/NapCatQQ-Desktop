name: Release MSI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tag / tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      draft:
        description: "是否创建 draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_plain: ${{ steps.version.outputs.VERSION_PLAIN }}
    steps:
      - name: "检出代码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "解析版本号"
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ inputs.version }}"

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref }}" -replace "refs/tags/", ""
          } elseif ($inputVersion) {
            $version = $inputVersion
          } elseif (Test-Path "src-tauri/tauri.conf.json") {
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $version = $config.version
          } elseif (Test-Path "package.json") {
            $package = Get-Content "package.json" -Raw | ConvertFrom-Json
            $version = $package.version
          } else {
            Write-Error "无法从 tag、输入、src-tauri/tauri.conf.json 或 package.json 解析版本号"
            exit 1
          }

          if (-not $version) {
            Write-Error "解析出的版本号为空"
            exit 1
          }

          if (-not ($version -like "v*")) {
            $version = "v$version"
          }

          $plain = $version -replace "^v", ""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION_PLAIN=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

  build-msi:
    needs: resolve
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      git_ref: ${{ github.ref }}
    secrets: inherit

  publish:
    needs:
      - resolve
      - build-msi
    runs-on: windows-latest
    steps:
      - name: "检出代码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "下载 MSI 制品"
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-msi.outputs.artifact_name }}
          path: release-assets

      - name: "生成 Release notes"
        id: notes
        shell: pwsh
        run: |
          $notesPath = "release-notes.md"
          @"
          NapCatQQ Desktop ${{ needs.resolve.outputs.version }}

          Windows installer assets are generated by the Tauri MSI workflow.
          "@ | Set-Content -Path $notesPath -Encoding UTF8
          "NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: "检查 Release 制品"
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path "release-assets" -Filter "*.msi" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            Write-Error "release-assets 中没有 MSI 制品"
            exit 1
          }
          $msiFiles | ForEach-Object { Write-Host "MSI asset: $($_.FullName)" }

      - name: "发布到 GitHub Releases"
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.resolve.outputs.version }}
          name: NapCatQQ Desktop ${{ needs.resolve.outputs.version }}
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          files: |
            release-assets/**/*.msi
            release-assets/**/*.sig
            release-assets/**/latest.json
