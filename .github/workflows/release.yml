# Desktop MSI 发版。与 ncd-watch 的 watch-v* 分流；本工作流只响应 v*.*.*。
# 质量门禁默认信任 ci.yml；需要时可勾选 run_gates 再测一遍。

name: Release MSI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，支持 1.7.28 或 v1.7.28；为空时从 tag / tauri.conf.json / package.json 读取"
        required: false
        default: ""
        type: string
      draft:
        description: "是否创建 draft release"
        required: false
        default: true
        type: boolean
      run_gates:
        description: "发版前再跑一遍门禁（Windows cargo test + 前端）；默认关闭以缩短发版"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-msi-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_plain: ${{ steps.version.outputs.VERSION_PLAIN }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.version }}"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            raw="${{ github.ref_name }}"
          elif [[ -n "${input_version}" ]]; then
            raw="${input_version}"
          elif [[ -f src-tauri/tauri.conf.json ]]; then
            raw="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          elif [[ -f package.json ]]; then
            raw="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          else
            echo "无法从 tag、输入、tauri.conf.json 或 package.json 解析版本号" >&2
            exit 1
          fi

          plain="${raw#v}"
          if [[ -z "${plain}" ]]; then
            echo "解析出的版本号为空: raw=${raw}" >&2
            exit 1
          fi

          version="v${plain}"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION_PLAIN=${plain}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved Desktop version: ${version}"

  gates:
    name: Optional release gates
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gates }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-gates-windows
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Check version metadata
        run: pnpm run check:versions

      - name: Export ts-rs bindings
        shell: pwsh
        run: cargo test --workspace --lib export_bindings_ -- --quiet

      - name: Assert generated IPC types committed
        shell: pwsh
        run: git diff --exit-code -- src-ui/core/ipc/generated

      - name: Frontend unit tests
        run: pnpm run test:unit

      - name: Workspace tests
        run: cargo test --workspace

  build-msi:
    needs:
      - resolve
      - gates
    # gates 跳过时 needs.gates.result = skipped，仍应继续打包。
    if: ${{ always() && needs.resolve.result == 'success' && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      git_ref: ${{ github.ref }}
    secrets: inherit

  publish:
    needs:
      - resolve
      - build-msi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-msi.outputs.artifact_name }}
          path: release-assets

      - name: Verify assets and checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          msis=(*.msi)
          if [[ ${#msis[@]} -lt 1 ]]; then
            echo "release-assets 中没有 MSI" >&2
            ls -la
            exit 1
          fi
          : > SHA256SUMS
          for f in *; do
            [[ -f "$f" ]] || continue
            [[ "$f" == "SHA256SUMS" ]] && continue
            sha256sum "$f" >> SHA256SUMS
          done
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
          ls -lh

      - name: Render release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          plain="${{ needs.resolve.outputs.version_plain }}"
          notes_path=release-notes.md
          # 优先 docs/releases/vX.Y.Z.md；无策展文件时脚本生成过滤后的自动草稿
          node scripts/release-notes.mjs render \
            --kind desktop \
            --version "${plain}" \
            --out "${notes_path}"
          echo "NOTES_PATH=${notes_path}" >> "$GITHUB_OUTPUT"
          echo "---- release notes ----"
          cat "${notes_path}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          name: NapCatQQ Desktop ${{ needs.resolve.outputs.version_plain }}
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          # 自更新走 GitHub Release MSI，不上传 latest.json / .sig
          files: |
            release-assets/*.msi
            release-assets/SHA256SUMS
          fail_on_unmatched_files: false
