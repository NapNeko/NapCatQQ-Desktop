name: 功能请求
description: 提议新功能或对现有能力的增强
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先在 [Issues](https://github.com/NapNeko/NapCatQQ-Desktop/issues?q=is%3Aissue) 搜一下有没有类似提案。

        > 当前主线是 **V3（Rust + Tauri + React，`3.0.0+`）**。提案默认按 V3 能力与架构评估；旧 Python / 2.x 不再作为新功能目标。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过 Issues，确认没有重复的提案
          required: true
        - label: 标题已改成能看懂的一句话（不要只留 `[Feature]` 前缀）
          required: true
        - label: 我知道空白 / 不选模板的 issue 会被关闭
          required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - Bot · NapCat
        - Bot · SnowLuma
        - 远端 / SSH / 部署
        - Docker
        - 组件安装
        - 设置 / 通知 / 自更新
        - ncd-watch
        - 界面 / 交互
        - 安装 / 升级 / MSI
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需求场景 / 当前痛点
      description: 这个功能要解决什么问题？现在怎么凑合的？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望它怎么工作？有界面或流程的话可以简述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 还想过哪些路，为什么不用

  - type: textarea
    id: references
    attributes:
      label: 参考链接
      description: 相关 Issue / PR、其它产品截图说明等
      placeholder: |
        - 相关讨论: #xxx

  - type: dropdown
    id: willingness
    attributes:
      label: 你是否愿意提交 PR 来实现？
      options:
        - 愿意，但需要先讨论方案
        - 愿意，已有大致思路
        - 暂时只提建议
    validations:
      required: true
